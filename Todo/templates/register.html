{% extends 'base.html' %}
{% block content %}
    <div>
        <form method="POST">
            {% csrf_token %}
            <fieldset>
                <legend>Join Today</legend>
                {{ form.as_p }}
            </fieldset>
            <div style="margin-top: 20px;">
                <button type="submit">Sign Up</button>
            </div>
        </form>
        <div style="margin-top: 20px;">
            <small>Already Have An Account? <a href="{% url 'login' %}">Sign In</a></small>
        </div>
    </div>
{% endblock content %}
