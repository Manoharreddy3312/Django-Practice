<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>

    <style>
        form {
            border: 2px solid black;
            width: 20%;
            margin-left: 40%;
            margin-top: 7%;
            padding: 15px;
            border-radius: 10px;

            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.2);
        }

        button {
            border: none;
            outline: none;
            padding: 10px;
            margin-left: 25%;
            background-color: orange;
            color: black;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            width: 50%;
        }

        input {
            border: none;
            outline: none;
            border: 2px solid rgb(132, 88, 88);
            border-radius: 5px;
            height: 25px;

        }
    </style>
</head>

<body>
    <form action="" method="post">
        {% csrf_token %}
        <h1 style="text-align: center; color: red;">STUDENT FORM</h1>
        <label style="font-size: 20px;" for="">Name : </label> <input type="text" name="name" id=""> <br><br>
        <label style="font-size: 20px;" for="">Mobile : </label> <input type="text" name="mobile" id=""> <br><br>
        <label style="font-size: 20px;" for="">Email : </label> <input type="text" name="email" id=""> <br><br>
        <label style="font-size: 20px;" for="">DOB : </label> <input type="date" name="DOB" id=""> <br><br>
        <label style="font-size: 20px;" for="">Qualification : </label> <input type="text" name="qualification" id="">
        <br><br>
        <label style="font-size: 20px;" for="">Stream : </label> <input type="text" name="stream" id=""> <br><br>
        <label style="font-size: 20px;" for="">Gender :
            <select name="gender" id="" style="height:40px; border: 2px solid rgb(132, 88, 88); border-radius: 5px;">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </label>

        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
