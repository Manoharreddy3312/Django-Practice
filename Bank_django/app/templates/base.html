<!DOCTYPE html>
<html>
<head>
<title>Manchi Bank System</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background-image:url("https://images.unsplash.com/photo-1556745757-8d76bdb6984b");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* Overlay for readability */
.overlay{
    background:rgba(0,0,0,0.6);
    min-height:100vh;
    color:white;
}

/* Navbar */
.navbar{
    background:#0d6efd;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.navbar h2{
    margin:0;
}

.nav-links a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:18px;
}

.nav-links a:hover{
    text-decoration:underline;
}

/* Content box */
.container{
    padding:40px;
    text-align:center;
}

/* Button style */
.btn{
    padding:10px 25px;
    background:white;
    color:#0d6efd;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
}

.btn:hover{
    background:#e6e6e6;
}

</style>

</head>

<body>

<div class="overlay">

<div class="navbar">

<h2>🏦 Mana Village Bank </h2>

<div class="nav-links">
<a href="/">Home</a>
<a href="/create/">Create Account</a>
<a href="/setpin/">Set PIN</a>
<a href="/balance/">Check Balance</a>
</div>

</div>

<div class="container">

{% block content %}

{% endblock %}

</div>

</div>

</body>
</html>
