<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIN Success</title>

<style>

/* 🌌 Background */
body{
    margin:0;
    padding:0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Card */
.success-card{
    background: rgba(0,0,0,0.7);
    padding:40px;
    border-radius:15px;
    text-align:center;
    width:400px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px #00f7ff;
    animation: fadeIn 1s ease-in-out;
}


.success-card h1{
    color:#00f7ff;
    text-shadow:0 0 10px #00f7ff, 0 0 20px #6a5acd;
}


.success-card p{
    color:white;
    margin-top:15px;
}

/* Button */
.home-btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    color:white;
    background: linear-gradient(45deg,#00f7ff,#6a5acd);
    transition:0.3s;
}

/* Hover */
.home-btn:hover{
    box-shadow:0 0 15px #00f7ff,0 0 25px #6a5acd;
    transform: scale(1.05);
}

/* GIF */
.gif-img{
    width:120px;
    margin-bottom:15px;
}

/* Animation */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

</style>

</head>
<body>

<div class="success-card">

    <img class="gif-img" src="https://media.giphy.com/media/111ebonMs90YLu/giphy.gif" alt="success">

    <h1>🎉 PIN Set Successfully!</h1>

    <p>Your PIN has been set successfully.<br>
    You can now access your bank account securely.</p>

    <a href="/" class="home-btn">🏠 Go to Home</a>

</div>

</body>
</html>
