<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Country</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 50px;
            text-align: center;
        }

        input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Country Information Search</h1>
    <form action="{% url 'search_country' %}" method="post">
        {% csrf_token %}
        <input type="text" name="country_name" placeholder="Enter country name (e.g., India)" required>
        <button type="submit">Search</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
</body>

</html>
